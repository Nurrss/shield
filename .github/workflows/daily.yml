# Ежедневный прогон на GitHub Actions (бесплатно для публичных и в лимитах для приватных репозиториев).
# База хранится как артефакт между запусками. Для продакшена лучше Railway/VPS с постоянным диском.
name: daily-scan
on:
  schedule:
    - cron: "0 2 * * *"   # 07:00 по Астане
  workflow_dispatch: {}

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt && python -m playwright install --with-deps chromium
      - name: Restore DB
        uses: dawidd6/action-download-artifact@v6
        with: { name: shield-db, path: data, if_no_artifact_found: warn, workflow_conclusion: success }
      - run: python -m shield run
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - run: python -m shield events --days 1
      - name: Telegram alerts (пропускается, если секреты не заданы)
        if: ${{ env.TELEGRAM_BOT_TOKEN != '' }}
        run: python -m shield notify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - run: python -m shield export data/threats.csv && python -m shield report data/report.html
      # База + скриншоты хранятся вместе: без скриншотов отчёт и алерты потеряют картинки
      - uses: actions/upload-artifact@v4
        with:
          name: shield-db
          path: |
            data/shield.db
            data/screenshots
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: threats-report
          path: |
            data/threats.csv
            data/report.html
